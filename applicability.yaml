# OWASP AISVS v1.01 applicability for the synthetic Ops Copilot demo.
#
# Requirements listed under not_applicable are excluded from the scorecard
# denominator and rendered as N/A. Each entry names a category whose rationale
# explains why the control cannot apply to this system's architecture. This file
# only declares intrinsic non-applicability; it must never be used to move a
# requirement that the demo could exercise out of scope.
format_version: 1
source: OWASP AISVS v1.01 applicability for the synthetic Ops Copilot demo

categories:
  no_training: >-
    The demo deploys a pinned, prebuilt model and performs inference only. It has
    no training, fine-tuning, RLHF, quantization, labeling, or dataset-ingestion
    pipeline to which this control could apply.
  accelerator: >-
    The demo runs CPU-only inference in a local container. It deploys no GPU or
    other accelerator, so accelerator firmware, attestation, memory-isolation and
    interconnect controls cannot apply.
  edge: >-
    The demo runs as a local container, not on edge, mobile, IoT or embedded
    devices, so edge-device authentication, packaging and storage controls cannot
    apply.
  multitenant: >-
    The demo is a single-tenant local system with one shared serving process, so
    multi-tenant isolation and shared-serving controls cannot apply.
  federated: >-
    The demo is a self-contained system with no federated or multi-system agent
    deployment, so cross-system agent authentication controls cannot apply.
  multimodal: >-
    The demo is text-only and generates no images, audio or video, so
    non-text-input and generated-media controls cannot apply.
  remote_mcp: >-
    The demo uses a local stdio MCP server only and exposes no remote HTTP or
    OAuth MCP transport, so remote-transport, OAuth-token and URL-elicitation
    controls cannot apply.
  confidential: >-
    The demo provides no TEE, confidential-computing or hardware workload
    attestation infrastructure, so those controls cannot apply.
  provider_routing: >-
    The demo uses a single pinned local model and has no hosted provider,
    model-version or routing changes to re-evaluate.
  watermark: >-
    The demo applies no model or generated-media watermarking or fingerprinting.

