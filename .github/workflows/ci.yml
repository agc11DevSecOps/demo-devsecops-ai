name: verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Run unit tests
        run: make test

  demo:
    needs: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Fetch the pinned base image
        run: docker pull python@sha256:47ae396f09c1303b8653019811a8498470603d7ffefc29cb07c88f1f8cb3d19f
      - name: Verify pinned Rego policy
        run: make test-policy
      - name: Verify the gateway contract in the restricted image
        run: make test-gateway-unit
      - name: Run offline A/B demo
        run: make GARAK_LIMIT=5 demo
      - name: Verify container boundary artifacts
        run: make test-container
      - name: Upload scorecard
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scorecard
          path: |
            scorecard/out.md
            scorecard/out.html
            scorecard/delta.csv
          if-no-files-found: error
          retention-days: 14
