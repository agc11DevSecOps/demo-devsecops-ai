templates:
  model-admission:
    - standard: aisvs-1.01
      ids: [v1.01-C3.1.2, v1.01-C6.1.3, v1.01-C6.2.3]
      objective: Admit a model artifact only with a safe format, a verified signature and a complete AI BOM.
    - standard: owasp-llm-top-10-2025
      ids: [LLM03]
      objective: Treat model and dependency provenance as a supply-chain decision input, not as a downstream action.
    - standard: nist-ssdf-1.1
      ids: [PW.4, PW.7]
      objective: Keep the model artifact and its bill of materials reviewable and reproducible.

  tool-authorization:
    - standard: aisvs-1.01
      ids: [v1.01-C9.2.1, v1.01-C9.5.1, v1.01-C9.5.3]
      objective: Default-deny tool access, with human approval bound to a high-impact call.
    - standard: owasp-llm-top-10-2025
      ids: [LLM06]
      objective: Keep model reach over tools minimal, scoped and human-gated.
    - standard: owasp-asvs-5.0.0
      ids: [V4]
      objective: Access control decisions are enforced outside the model and are auditable.

  rag-admission:
    - standard: aisvs-1.01
      ids: [v1.01-C8.1.2, v1.01-C8.2.4, v1.01-C8.3.3]
      objective: Only documents from an approved writer enter the retrievable corpus.
    - standard: owasp-llm-top-10-2025
      ids: [LLM08]
      objective: Vector retrieval is filtered by provenance, not only by similarity.
    - standard: owasp-asvs-5.0.0
      ids: [V5]
      objective: Untrusted content is sanitised and validated before it can influence a response.

  input-output-guardrails:
    - standard: aisvs-1.01
      ids: [v1.01-C2.1.1, v1.01-C2.1.4, v1.01-C7.1.1, v1.01-C8.2.1]
      objective: Screen input, bound output, and never treat model output as a decision.
    - standard: owasp-llm-top-10-2025
      ids: [LLM01, LLM02, LLM10]
      objective: Detect prompt injection, mask sensitive data, and bound consumption.
    - standard: nist-ai-rmf-1.0
      ids: [MEASURE 2.7, MANAGE 4.1]
      objective: Measure and manage input and output risk with deterministic, reviewable controls.

  runtime-evidence:
    - standard: aisvs-1.01
      ids: [v1.01-C9.6.1, v1.01-C12.1.2, v1.01-C12.4.3]
      objective: A stop control interrupts inference and evidence stays hash-only.
    - standard: owasp-llm-top-10-2025
      ids: [LLM10]
      objective: Rate and size limits keep consumption bounded.
    - standard: nist-ai-rmf-1.0
      ids: [GOVERN 1.1, MANAGE 2.2]
      objective: Governance and risk management are visible in recorded evidence.
    - standard: nist-ssdf-1.1
      ids: [PS.1, RV.1]
      objective: Protect the development environment and record findings for response.
