# Standards Register
#
# This file is the machine-readable companion of
# docs/standards-and-policy-mapping.md.
#
# It records control objectives only. A mapping entry says "this policy
# pattern targets this objective". It never means the demo complies with,
# passes, is audited against, or is certified against a standard, and it never
# authorizes an action.
#
# The full provenance of each source, including publisher, immutable version,
# content hash, licence, retrieval date, review, and permitted use, lives in
# third_party_sources.md.

format: 1
status: reviewed
note: >-
  Control-objective mapping only. Never a compliance, certification, coverage,
  or audit claim. Never an authorization signal.

