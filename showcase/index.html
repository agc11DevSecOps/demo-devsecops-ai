<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Visual Assurance</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header><p class="eyebrow">OFFLINE SECURITY DEMONSTRATION</p><h1>Visual Assurance</h1><p id="meta">Loading validated bundle...</p></header>
  <main>
    <section class="challenge"><div><p class="eyebrow">LIVE-STYLE PROOF</p><h2>Nonce RAG Challenge</h2><p id="challenge-status">No local challenge captured in this bundle.</p></div><pre id="challenge-detail"></pre></section>
    <section><div class="section-title"><p class="eyebrow">SAME INPUT, DIFFERENT CONTROLS</p><h2>Evidence Dossier</h2><div class="playback"><button id="replay-play" type="button">Autoplay</button><button id="replay-next" type="button">Next control</button><output id="replay-position">0 controls</output></div></div><div id="dossier" class="dossier"></div></section>
  </main>
  <template id="evidence-template"><article class="evidence-step"><header><p class="eyebrow"></p><h3></h3><p class="reason"></p></header><div class="evidence-grid"><section><h4>Input</h4><pre class="input"></pre></section><section><h4>Control</h4><pre class="control"></pre></section><section><h4>Observed evidence</h4><pre class="observation"></pre></section><section><h4>State after</h4><pre class="state"></pre></section></div><details><summary>Evidence binding and AISVS</summary><pre class="binding"></pre></details></article></template>
  <script src="app.js"></script>
</body>
</html>
